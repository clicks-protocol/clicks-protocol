<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Clicks Settlement Queue Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #060710;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: absolute;
        inset: -180px;
        background:
          radial-gradient(circle at 18% 22%, rgba(0, 255, 155, 0.24) 0%, transparent 34%),
          radial-gradient(circle at 80% 24%, rgba(0, 150, 255, 0.18) 0%, transparent 32%),
          radial-gradient(circle at 50% 82%, rgba(28, 39, 72, 0.88) 0%, transparent 56%);
        filter: blur(44px);
      }
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(6, 7, 16, 0.28) 0%, rgba(6, 7, 16, 0.08) 26%, rgba(6, 7, 16, 0.68) 100%),
          repeating-linear-gradient(180deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 4px);
        pointer-events: none;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .frame {
        position: absolute;
        inset: 46px;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          inset 0 0 0 1px rgba(0, 255, 155, 0.05),
          0 0 90px rgba(0, 255, 155, 0.08);
      }

      .brand-row {
        position: absolute;
        top: 112px;
        left: 88px;
        right: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        opacity: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand-logo {
        width: 56px;
        height: 56px;
        filter: drop-shadow(0 0 24px rgba(0, 255, 155, 0.45));
      }
      .brand-name {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 4px;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        letter-spacing: 2px;
        color: #00ff9b;
        text-transform: uppercase;
      }

      .card {
        position: absolute;
        top: 260px;
        left: 76px;
        right: 76px;
        bottom: 204px;
        border-radius: 34px;
        background: linear-gradient(180deg, rgba(17, 21, 37, 0.88) 0%, rgba(10, 13, 23, 0.92) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 70px 64px 54px;
        box-shadow:
          0 18px 80px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: hidden;
        opacity: 0;
      }
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #00ff9b 0%, #00b2ff 100%);
        box-shadow: 0 0 28px rgba(0, 255, 155, 0.45);
      }

      .headline {
        font-size: 108px;
        line-height: 0.94;
        letter-spacing: -4px;
        font-weight: 900;
        max-width: 760px;
        opacity: 0;
      }
      .headline span {
        color: #00ff9b;
      }

      .divider {
        width: 84px;
        height: 6px;
        margin: 42px 0 34px;
        border-radius: 999px;
        background: linear-gradient(90deg, #00ff9b 0%, rgba(0,255,155,0.08) 100%);
        opacity: 0;
      }

      .line-list {
        display: grid;
        gap: 18px;
      }
      .line {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        opacity: 0;
      }
      .line-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #00ff9b;
        box-shadow: 0 0 20px rgba(0, 255, 155, 0.6);
        margin-top: 14px;
        flex: 0 0 auto;
      }
      .line-text {
        font-size: 38px;
        line-height: 1.18;
        letter-spacing: -0.8px;
        color: rgba(255, 255, 255, 0.9);
      }

      .footer {
        position: absolute;
        left: 76px;
        right: 76px;
        bottom: 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        opacity: 0;
      }
      .footer-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.76);
      }
      .footer-pill strong {
        color: #ffffff;
        font-weight: 700;
      }
      .footer-site {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.54);
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1080" data-height="1920">
      <div class="frame"></div>

      <div class="brand-row">
        <div class="brand">
          <img class="brand-logo clip" id="brand-logo" data-start="0" data-duration="6.5" data-track-index="1" src="assets/icon.png" alt="Clicks" />
          <div class="brand-name">CLICKS PROTOCOL</div>
        </div>
        <div class="eyebrow" data-slot="eyebrow">settlement router</div>
      </div>

      <div class="card">
        <div class="headline" data-slot="headline">Payments solved. <span>Settlement not.</span></div>
        <div class="divider"></div>
        <div class="line-list">
          <div class="line line-1">
            <div class="line-dot"></div>
            <div class="line-text" data-slot="line1">Keep working capital liquid.</div>
          </div>
          <div class="line line-2">
            <div class="line-dot"></div>
            <div class="line-text" data-slot="line2">Route the idle slice into yield.</div>
          </div>
          <div class="line line-3">
            <div class="line-dot"></div>
            <div class="line-text" data-slot="line3">Do both without breaking spendability.</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="footer-pill">
          <span>mode</span>
          <strong data-slot="footer_left">80 liquid · 20 yield</strong>
        </div>
        <div class="footer-site" data-slot="footer_right">clicksprotocol.xyz</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to('.brand-row', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.15)
        .from('.brand-row', { y: -18, duration: 0.45, ease: 'power2.out' }, 0.15)
        .to('.card', { opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.45)
        .from('.card', { y: 28, scale: 0.97, duration: 0.7, ease: 'power3.out' }, 0.45)
        .to('.headline', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 0.9)
        .from('.headline', { y: 20, duration: 0.55, ease: 'power2.out' }, 0.9)
        .to('.divider', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.2)
        .to('.line-1', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.35)
        .from('.line-1', { x: -12, duration: 0.35, ease: 'power2.out' }, 1.35)
        .to('.line-2', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.58)
        .from('.line-2', { x: -12, duration: 0.35, ease: 'power2.out' }, 1.58)
        .to('.line-3', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.81)
        .from('.line-3', { x: -12, duration: 0.35, ease: 'power2.out' }, 1.81)
        .to('.footer', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 2.15)
        .from('.footer', { y: 12, duration: 0.4, ease: 'power2.out' }, 2.15)
        .to({}, { duration: 3.45 }, 2.55)
        .to(['.brand-row', '.card', '.footer'], { opacity: 0, duration: 0.35 }, 6.1);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
