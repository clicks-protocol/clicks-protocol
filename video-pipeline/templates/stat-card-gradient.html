<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Clicks Stat Card — Gradient</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0B0610;
        font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
      }
      /* multi-stop mesh gradient for richer atmosphere */
      body::before {
        content: '';
        position: absolute; inset: 0;
        background:
          radial-gradient(circle at 15% 20%, rgba(0,255,155,0.22) 0%, transparent 40%),
          radial-gradient(circle at 85% 85%, rgba(88,0,255,0.18) 0%, transparent 45%),
          radial-gradient(circle at 50% 60%, rgba(0,255,155,0.08) 0%, transparent 60%);
      }
      body::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(11,6,16,0) 0%, rgba(11,6,16,0.55) 100%);
      }

      #root { position: relative; width: 100%; height: 100%; }

      .brand {
        position: absolute;
        top: 120px; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center;
        gap: 22px;
      }
      .brand-logo { width: 88px; height: 88px; filter: drop-shadow(0 0 20px rgba(0,255,155,0.5)); }
      .brand-name { font-size: 56px; font-weight: 900; letter-spacing: 10px; color: #00FF9B; line-height: 1; }

      .stat-wrap {
        position: absolute; top: 50%; left: 0; right: 0;
        transform: translateY(-50%);
        text-align: center; padding: 0 60px;
      }
      .stat {
        font-size: 360px; font-weight: 900; line-height: 1;
        letter-spacing: -10px;
        background: linear-gradient(180deg, #A7F3D0 0%, #00FF9B 55%, #008B54 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 80px rgba(0,255,155,0.35));
      }
      .label {
        font-size: 72px; font-weight: 800; color: #ffffff;
        margin-top: 36px; letter-spacing: -1px;
      }
      .subtext {
        font-size: 36px; font-weight: 400; color: #9ca3af;
        margin-top: 32px; letter-spacing: 0.5px;
        max-width: 900px; margin-inline: auto; line-height: 1.4;
      }

      .footer {
        position: absolute;
        bottom: 100px; left: 0; right: 0;
        text-align: center;
      }
      .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 16px 28px; border-radius: 999px;
        background: rgba(0,255,155,0.08);
        border: 1px solid rgba(0,255,155,0.35);
        color: #a7f3d0; font-size: 26px; font-weight: 600;
        letter-spacing: 1px;
      }
      .pill::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #00FF9B; box-shadow: 0 0 12px rgba(0,255,155,0.8); }

      .brand, .stat, .label, .subtext, .footer { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div class="brand">
        <img class="brand-logo" src="assets/icon.png" alt="Clicks" />
        <div class="brand-name">CLICKS</div>
      </div>

      <div class="stat-wrap">
        <div class="stat" data-slot="stat">227</div>
        <div class="label" data-slot="label">tests passing</div>
        <div class="subtext" data-slot="subtext">Full V4 + V5 suite green</div>
      </div>

      <div class="footer">
        <div class="pill">clicksprotocol.xyz</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(".brand",   { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1)
        .from(".brand", { y: -30, duration: 0.6, ease: "power2.out" }, 0.1)
        .to(".stat",    { opacity: 1, duration: 0.8, ease: "power3.out" }, 0.8)
        .from(".stat",  { scale: 0.85, duration: 0.8, ease: "power3.out" }, 0.8)
        .to(".label",   { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.7)
        .from(".label", { y: 20, duration: 0.6, ease: "power2.out" }, 1.7)
        .to(".subtext", { opacity: 1, duration: 0.6, ease: "power2.out" }, 2.2)
        .from(".subtext", { y: 20, duration: 0.6, ease: "power2.out" }, 2.2)
        .to(".footer",  { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.7)
        .to({}, { duration: 4.0 }, 3.4)
        .to([".stat", ".label", ".subtext", ".footer", ".brand"], { opacity: 0, duration: 0.4 }, 7.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
