<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Clicks Stat Card — Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0F0814;
        font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
      }
      /* Blueprint-style grid (matches landing page vibe) */
      body::before {
        content: '';
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(0,255,155,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,255,155,0.06) 1px, transparent 1px);
        background-size: 90px 90px;
        background-position: -45px -45px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 45%, black 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 45%, black 0%, transparent 75%);
      }
      body::after {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 40%, rgba(0,255,155,0.08) 0%, transparent 60%);
      }

      #root { position: relative; width: 100%; height: 100%; }

      /* Top badge bar */
      .top-bar {
        position: absolute; top: 100px; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center; gap: 22px;
      }
      .brand-logo { width: 72px; height: 72px; filter: drop-shadow(0 0 14px rgba(0,255,155,0.45)); }
      .brand-name { font-size: 44px; font-weight: 900; letter-spacing: 9px; color: #00FF9B; line-height: 1; }

      /* Stat block, centered */
      .stat-wrap {
        position: absolute; top: 50%; left: 0; right: 0;
        transform: translateY(-50%);
        text-align: center; padding: 0 60px;
      }
      .eyebrow {
        display: inline-block;
        font-size: 24px; letter-spacing: 8px; text-transform: uppercase;
        color: #00FF9B; font-weight: 700;
        padding: 12px 26px;
        border: 1px solid rgba(0,255,155,0.4);
        border-radius: 999px;
        margin-bottom: 44px;
      }
      .stat {
        font-size: 340px; font-weight: 900; line-height: 1;
        color: #00FF9B; letter-spacing: -10px;
        text-shadow:
          0 0 60px rgba(0,255,155,0.35),
          0 0 120px rgba(0,255,155,0.15);
      }
      .label {
        font-size: 76px; font-weight: 800; color: #fff;
        margin-top: 36px; letter-spacing: -1px;
      }

      /* Divider + caption */
      .divider {
        width: 120px; height: 3px;
        background: linear-gradient(90deg, transparent, #00FF9B, transparent);
        margin: 40px auto 32px;
      }
      .subtext {
        font-size: 36px; color: #9ca3af; font-weight: 400;
        letter-spacing: 0.5px; line-height: 1.4;
        max-width: 900px; margin-inline: auto;
      }

      /* Bottom ticker */
      .footer {
        position: absolute; bottom: 100px; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center; gap: 16px;
        font-size: 24px; color: #6b7280; letter-spacing: 3px; text-transform: uppercase;
      }
      .footer .dot { width: 8px; height: 8px; border-radius: 50%; background: #00FF9B; box-shadow: 0 0 10px rgba(0,255,155,0.8); }
      .footer span { color: #374151; margin: 0 6px; }

      .top-bar, .eyebrow, .stat, .label, .divider, .subtext, .footer { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div class="top-bar">
        <img class="brand-logo" src="assets/icon.png" alt="Clicks" />
        <div class="brand-name">CLICKS</div>
      </div>

      <div class="stat-wrap">
        <div class="eyebrow">on base mainnet</div>
        <div class="stat" data-slot="stat">227</div>
        <div class="label" data-slot="label">tests passing</div>
        <div class="divider"></div>
        <div class="subtext" data-slot="subtext">Full V4 + V5 suite green</div>
      </div>

      <div class="footer">
        <div class="dot"></div> clicksprotocol.xyz <span>·</span> agentId 45074
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(".top-bar",  { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1)
        .from(".top-bar", { y: -30, duration: 0.6, ease: "power2.out" }, 0.1)
        .to(".eyebrow",  { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.6)
        .from(".eyebrow", { y: 10, duration: 0.5, ease: "power2.out" }, 0.6)
        .to(".stat",     { opacity: 1, duration: 0.8, ease: "power3.out" }, 0.9)
        .from(".stat",   { scale: 0.85, duration: 0.8, ease: "power3.out" }, 0.9)
        .to(".label",    { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.8)
        .from(".label",  { y: 20, duration: 0.6, ease: "power2.out" }, 1.8)
        .to(".divider",  { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.3)
        .from(".divider",{ scaleX: 0, duration: 0.5, ease: "power2.out" }, 2.3)
        .to(".subtext",  { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.5)
        .from(".subtext",{ y: 20, duration: 0.5, ease: "power2.out" }, 2.5)
        .to(".footer",   { opacity: 1, duration: 0.6, ease: "power2.out" }, 2.9)
        .to({}, { duration: 4.0 }, 3.5)
        .to([".stat", ".label", ".divider", ".subtext", ".footer", ".eyebrow", ".top-bar"], { opacity: 0, duration: 0.4 }, 7.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
